[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wnba-props-dashboard"
version = "1.0.0"
description = "Self-contained WNBA player props analytics pipeline"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "scipy>=1.13,<2",
  "pyarrow>=17,<20",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
