name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Validate published artifact when present
        run: |
          if test -f data/processed/dashboard_data.json && test -f site/index.html; then
            python scripts/validate_outputs.py --data data/processed/dashboard_data.json --site site/index.html
          fi
